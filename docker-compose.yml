services:
  postgres:
    image: postgres:16-alpine
    container_name: market-signal-engine-postgres
    environment:
      POSTGRES_DB: market_signal_engine
      POSTGRES_USER: market_signal_engine
      POSTGRES_PASSWORD: market_signal_engine_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_signal_engine -d market_signal_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
